<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SmartConstruction logo">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D6FC2"/>
      <stop offset="1" stop-color="#0E3D6E"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="48" height="48" rx="11" fill="url(#logoGrad)"/>

  <!-- Ascending skyline bars: growth + construction, rising left to right -->
  <rect x="11" y="22" width="6" height="14" rx="1.5" fill="#FFFFFF"/>
  <rect x="21" y="16" width="6" height="20" rx="1.5" fill="#FFFFFF"/>
  <rect x="31" y="10" width="6" height="26" rx="1.5" fill="#FFFFFF" fill-opacity="0.96"/>

  <!-- Foundation line -->
  <rect x="9" y="37.5" width="30" height="2.2" rx="1.1" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Brand-orange beacon marking the lead indicator, echoing the safety-orange accent used sitewide -->
  <circle cx="34" cy="7.2" r="2.7" fill="#F2600C"/>
</svg>
