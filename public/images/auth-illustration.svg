<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering blueprint illustration" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123B6B"/>
      <stop offset="1" stop-color="#0A2647"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="700" fill="url(#authBg)"/>
  <rect width="500" height="700" fill="url(#grid)"/>

  <circle cx="410" cy="120" r="150" fill="#F2A93B" opacity="0.08"/>

  <!-- blueprint building outline -->
  <g stroke="#7FB2E8" stroke-width="2" fill="none" opacity="0.85">
    <rect x="140" y="260" width="220" height="330"/>
    <line x1="140" y1="310" x2="360" y2="310"/>
    <line x1="140" y1="360" x2="360" y2="360"/>
    <line x1="140" y1="410" x2="360" y2="410"/>
    <line x1="140" y1="460" x2="360" y2="460"/>
    <line x1="140" y1="510" x2="360" y2="510"/>
    <line x1="140" y1="560" x2="360" y2="560"/>
    <line x1="190" y1="260" x2="190" y2="590"/>
    <line x1="250" y1="260" x2="250" y2="590"/>
    <line x1="310" y1="260" x2="310" y2="590"/>
  </g>
  <g fill="#F2A93B" opacity="0.9">
    <rect x="158" y="278" width="16" height="16"/>
    <rect x="206" y="278" width="16" height="16"/>
    <rect x="266" y="278" width="16" height="16"/>
    <rect x="326" y="278" width="16" height="16"/>
  </g>

  <!-- crane beside building -->
  <g stroke="#EAF3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M395 590 L395 150"/>
    <path d="M395 150 L235 150"/>
    <path d="M395 190 L365 240"/>
    <path d="M395 190 L425 240"/>
  </g>
  <path d="M245 150 L245 210" stroke="#F2A93B" stroke-width="3" stroke-linecap="round"/>
  <rect x="240.5" y="208" width="9" height="9" rx="1.5" fill="#F2A93B"/>

  <!-- dimension line + label, blueprint styling -->
  <g stroke="#7FB2E8" stroke-width="1.4" opacity="0.7">
    <line x1="140" y1="610" x2="360" y2="610"/>
    <line x1="140" y1="602" x2="140" y2="618"/>
    <line x1="360" y1="602" x2="360" y2="618"/>
  </g>
  <text x="250" y="636" fill="#9FC3EE" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">SITE PLAN — TOWER A</text>

  <!-- compass mark -->
  <g transform="translate(70,90)" stroke="#7FB2E8" stroke-width="1.5" fill="none" opacity="0.8">
    <circle r="26"/>
    <line x1="0" y1="-26" x2="0" y2="26"/>
    <line x1="-26" y1="0" x2="26" y2="0"/>
  </g>
  <text x="70" y="58" fill="#9FC3EE" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">N</text>

  <!-- floating dots -->
  <g fill="#F2A93B" opacity="0.6">
    <circle cx="440" cy="330" r="3"/>
    <circle cx="80" cy="480" r="3"/>
    <circle cx="120" cy="200" r="2.5"/>
  </g>
</svg>
