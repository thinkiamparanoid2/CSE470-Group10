<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric construction skyline illustration">
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B6B"/>
      <stop offset="1" stop-color="#081D38"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect width="460" height="200" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="460" height="200" fill="url(#authBg)"/>
    <rect width="460" height="200" fill="url(#grid)"/>

    <circle cx="55" cy="35" r="95" fill="#F2A93B" opacity="0.07"/>
    <circle cx="420" cy="40" r="110" fill="#3B82F6" opacity="0.14"/>

    <!-- ground shadow -->
    <ellipse cx="205" cy="181" rx="175" ry="9" fill="#020B18" opacity="0.35"/>

    <!-- distant background block -->
    <g opacity="0.55">
      <polygon points="310,120 328,110 310,100 292,110" fill="#7FAEDD"/>
      <polygon points="310,168 292,158 292,110 310,120" fill="#3D6C9C"/>
      <polygon points="310,168 328,158 328,110 310,120" fill="#234B78"/>
    </g>

    <!-- building A (short) -->
    <polygon points="104,123 124,112 104,101 84,112" fill="#A9D2F5"/>
    <polygon points="104,178 84,167 84,112 104,123" fill="#4A7FB5"/>
    <polygon points="104,178 124,167 124,112 104,123" fill="#234B78"/>

    <!-- building B (medium) -->
    <polygon points="160,93 184,80 160,67 136,80" fill="#B9D9F7"/>
    <polygon points="160,178 136,165 136,80 160,93" fill="#4A7FB5"/>
    <polygon points="160,178 184,165 184,80 160,93" fill="#234B78"/>
    <g fill="#DCEBFB" opacity="0.4">
      <rect x="149" y="146" width="6" height="8"/>
      <rect x="149" y="126" width="6" height="8"/>
      <rect x="149" y="106" width="6" height="8"/>
    </g>
    <g fill="#F2A93B" opacity="0.85">
      <rect x="165" y="148" width="6" height="8"/>
      <rect x="165" y="127" width="6" height="8"/>
      <rect x="165" y="105" width="6" height="8"/>
    </g>

    <!-- building C (hero tower) -->
    <polygon points="222,50 252,34 222,18 192,34" fill="#C4E0FB"/>
    <polygon points="222,178 192,162 192,34 222,50" fill="#5583B8"/>
    <polygon points="222,178 252,162 252,34 222,50" fill="#20486F"/>
    <g fill="#DCEBFB" opacity="0.35">
      <rect x="203" y="150" width="6" height="8"/>
      <rect x="203" y="130" width="6" height="8"/>
      <rect x="203" y="110" width="6" height="8"/>
      <rect x="203" y="90" width="6" height="8"/>
      <rect x="203" y="70" width="6" height="8"/>
    </g>
    <g fill="#F2A93B" opacity="0.9">
      <rect x="228" y="150" width="6" height="8"/>
      <rect x="228" y="129" width="6" height="8"/>
      <rect x="228" y="108" width="6" height="8"/>
      <rect x="228" y="87" width="6" height="8"/>
      <rect x="228" y="66" width="6" height="8"/>
    </g>

    <!-- tower crane -->
    <g stroke="#EAF3FC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M272 179 L272 15"/>
      <path d="M272 15 L410 15"/>
      <path d="M272 15 L250 15"/>
      <path d="M272 2 L410 15"/>
      <path d="M272 2 L250 15"/>
      <path d="M272 2 L272 15"/>
      <path d="M350 15 L350 52"/>
    </g>
    <rect x="238" y="10" width="15" height="9" rx="1.5" fill="#8FB9E6"/>
    <rect x="345.5" y="51" width="9" height="9" rx="1.5" fill="#F2A93B"/>

    <!-- floating accent dots -->
    <g fill="#F2A93B" opacity="0.55">
      <circle cx="60" cy="150" r="2.4"/>
      <circle cx="435" cy="150" r="2.4"/>
      <circle cx="70" cy="60" r="2"/>
    </g>
  </g>
</svg>
